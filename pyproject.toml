[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-companion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16", "numpy>=1.26,<3", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<0.6", "faster-whisper>=1,<2", "coqui-tts>=0.24,<1", "scipy>=1.11,<2"]

[project.scripts]
iris-host = "iris.server:main"
iris-simulator = "iris.simulator:main"

[tool.setuptools.packages.find]
include = ["iris*"]
