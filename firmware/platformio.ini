[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_REDTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=27000000
